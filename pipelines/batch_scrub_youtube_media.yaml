verbose: true

# File extensions treated as candidate inputs when scanning input_dir.
extensions:
  - ".mp4"
  - ".mov"
  - ".mkv"
  - ".avi"
  - ".mts"
  - ".m2ts"
  - ".webm"
  - ".m4a"
  - ".mp3"
  - ".opus"
  - ".flac"
  - ".wav"
  - ".ogg"
  - ".aac"
  - ".mka"

# Options forwarded verbatim to pipelines.scrub_youtube_media per file.
# See pipelines/scrub_youtube_media.yaml for that pipeline's own defaults —
# anything set here overrides them.
pipeline: {}
